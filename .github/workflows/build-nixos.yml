name: Build NixOS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flake.lock'

jobs:
  build-nixos:
    continue-on-error: true
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
        include:
          - os: ubuntu-latest
            config: absolute
          - os: ubuntu-26.04-arm
            config: nao

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Cachix
        uses: cachix/cachix-action@v17
        with:
          name: samlukeyes123
          extraPullNames: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build NixOS
        run: |
          nix build -L ".#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel"
